<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Admin — Cuts &amp; Style</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/admin/admin.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>💈</text></svg>">
</head>
<body>
  <!-- Login -->
  <div class="login-wrap" id="login-view" hidden>
    <form class="login card" id="login-form">
      <div class="brand"><span class="mark">C&amp;S</span><div><strong>Cuts &amp; Style</strong><small>Control panel</small></div></div>
      <label>Username <input name="username" autocomplete="username" required></label>
      <label>Password <input name="password" type="password" autocomplete="current-password" required></label>
      <button class="btn" type="submit">Sign in</button>
      <p class="err" id="login-err" role="alert"></p>
      <a href="/" class="back">← Back to website</a>
    </form>
  </div>

  <!-- App -->
  <div class="app" id="app-view" hidden>
    <aside class="sidebar" id="sidebar">
      <div class="brand"><span class="mark">C&amp;S</span><div><strong>Cuts &amp; Style</strong><small>Control panel</small></div></div>
      <nav>
        <a href="#dashboard" data-view="dashboard">📊 <span>Dashboard</span></a>
        <a href="#appointments" data-view="appointments">📅 <span>Appointments</span><b class="badge" id="badge-pending"></b></a>
        <a href="#services" data-view="services">✂️ <span>Services</span></a>
        <a href="#barbers" data-view="barbers">💈 <span>Barbers</span></a>
        <a href="#gallery" data-view="gallery">🖼️ <span>Gallery</span></a>
        <a href="#messages" data-view="messages">✉️ <span>Messages</span><b class="badge" id="badge-msg"></b></a>
        <a href="#settings" data-view="settings">⚙️ <span>Settings</span></a>
      </nav>
      <div class="side-foot">
        <a href="/" target="_blank">View website ↗</a>
        <button class="link" id="logout">Sign out</button>
      </div>
    </aside>
    <main class="main">
      <header class="topbar">
        <button class="menu-btn" id="menu-btn" aria-label="Menu">☰</button>
        <h1 id="view-title">Dashboard</h1>
        <div id="view-actions"></div>
      </header>
      <section id="view" class="view"></section>
    </main>
  </div>

  <!-- Modal -->
  <dialog id="modal">
    <form method="dialog" id="modal-form" class="modal-body">
      <header><h2 id="modal-title"></h2><button value="cancel" class="x" aria-label="Close" formnovalidate>×</button></header>
      <div id="modal-content"></div>
      <p class="err" id="modal-err" role="alert"></p>
      <footer><button value="cancel" class="btn btn-light" formnovalidate>Cancel</button><button value="ok" class="btn" id="modal-ok">Save</button></footer>
    </form>
  </dialog>

  <div class="toast" id="toast" role="status"></div>
  <script src="/admin/admin.js"></script>
</body>
</html>
